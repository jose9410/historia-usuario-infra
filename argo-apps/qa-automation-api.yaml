apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: qa-automation-api
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/jose9410/koncilia-infra.git'
    path: charts/qa-automation-api
    targetRevision: HEAD
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: requerimiento
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
