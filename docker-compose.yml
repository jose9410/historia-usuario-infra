services:
  # ─────────────────────────────────────────────────────────────────────────
  # Story Synthesis API  (service-a)
  # ─────────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend/HistoriaUsuario.Api
      dockerfile: Dockerfile
    container_name: story-synthesis-api
    ports:
      - "8080:8080"
    environment:
      - AzureOpenAI__DeploymentName=${AZURE_DEPLOYMENT_NAME}
      - AzureOpenAI__Endpoint=${AZURE_ENDPOINT}
      - AzureOpenAI__ApiKey=${AZURE_API_KEY}
      - Anthropic__ApiKey=${ANTHROPIC_API_KEY}
      - Anthropic__ModelId=${ANTHROPIC_MODEL_ID}
      - TranscriptionSettings__InputDirectory=${INPUT_DIRECTORY:-Inputs}
      - TranscriptionSettings__OutputDirectory=${OUTPUT_DIRECTORY:-Outputs}
      # OTel config — overrides appsettings.json
      - OpenTelemetry__OtlpEndpoint=http://otel-collector:4317
      - Services__QAAutomationApi=http://automation-api:8080
      # data-service URL: usa el nombre del contenedor (red interna Docker)
      # En AWS ECS se sobreescribe con http://data-service.local (Cloud Map)
      - DATA_SERVICE_URL=http://data-service:8080
      - DEPLOY_ENV=local
    volumes:
      - backend-outputs:/app/Outputs
    depends_on:
      - automation-api
      - data-service       # data-service debe arrancar antes que el backend
      - otel-collector
    restart: unless-stopped


  # ─────────────────────────────────────────────────────────────────────────
  # Compliance Automator API  (service-b)
  # ─────────────────────────────────────────────────────────────────────────
  automation-api:
    build:
      context: ./backend/QAAutomation.Api
      dockerfile: Dockerfile
    container_name: compliance-automator-api
    ports:
      - "8081:8080"
    environment:
      - OpenTelemetry__OtlpEndpoint=http://otel-collector:4317
      - DEPLOY_ENV=local
      - CHAOS_LATENCY_ENABLED=false
      - CHAOS_LATENCY_MS=200
    depends_on:
      - otel-collector
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # Data Service  (service-c) — Persistencia PostgreSQL
  # ─────────────────────────────────────────────────────────────────────────
  data-service:
    build:
      context: ./backend/DataService
      dockerfile: Dockerfile
    container_name: koncilia-data-service
    ports:
      - "8082:8080"
    environment:
      # Connection string apuntando al servicio 'postgres' del compose
      - ConnectionStrings__PostgreSQL=Host=postgres;Port=5432;Database=${POSTGRES_DB:-koncilia_data};Username=${POSTGRES_USER:-koncilia};Password=${POSTGRES_PASSWORD}
      - OpenTelemetry__OtlpEndpoint=http://otel-collector:4317
      - ASPNETCORE_ENVIRONMENT=Development
      - DEPLOY_ENV=local
      - CHAOS_ERROR_ENABLED=false
    depends_on:
      postgres:
        condition: service_healthy   # Esperar a que Postgres esté listo antes de arrancar
      otel-collector:
        condition: service_started
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # PostgreSQL 16 — Base de datos local para data-service
  # UI opcional: docker exec -it koncilia-postgres psql -U koncilia -d koncilia_data
  # ─────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: koncilia-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-koncilia_data}
      - POSTGRES_USER=${POSTGRES_USER:-koncilia}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"   # Expuesto en localhost para conectar con herramientas como DBeaver
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready verifica que el servidor PostgreSQL acepta conexiones
      test: ["CMD-SHELL", "pg_isready -U koncilia -d koncilia_data"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # AutoAnalyst Web
  # ─────────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend/koncilia-web
      dockerfile: Dockerfile
    container_name: autoanalyst-web
    ports:
      - "80:80"
    depends_on:
      - backend
      - automation-api
    restart: unless-stopped

  # ═════════════════════════════════════════════════════════════════════════
  # OBSERVABILITY STACK
  # ═════════════════════════════════════════════════════════════════════════

  # ── OpenTelemetry Collector ──────────────────────────────────────────────
  # Receives OTLP from both services, fans out to Jaeger, Loki, Prometheus.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.106.1
    container_name: otel-collector
    command: [ "--config=/etc/otel/config.yaml" ]
    volumes:
      - ./backend/otel-collector-config.local.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC (services push here)
      - "4318:4318"   # OTLP HTTP (fallback)
      - "8889:8889"   # Prometheus metrics scrape endpoint
      - "13133:13133" # Health check
    environment:
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - DEPLOY_ENV=local
    depends_on:
      - jaeger
      - loki
    restart: unless-stopped

  # ── Jaeger (distributed trace UI) ────────────────────────────────────────
  # UI: http://localhost:16686
  # Receives traces from the OTel Collector via OTLP gRPC.
  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: jaeger
    ports:
      - "16686:16686" # Jaeger UI
      - "14317:4317" # OTLP gRPC receiver (collector → Jaeger)
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped

  # ── Prometheus (metrics scraper + storage) ────────────────────────────────
  # Scrapes /metrics from the OTel Collector's Prometheus exporter.
  # Grafana reads from this instance.
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090" # Prometheus UI
    depends_on:
      - otel-collector
    restart: unless-stopped

  # ── Loki (log aggregation) ────────────────────────────────────────────────
  # Receives structured logs from the OTel Collector.
  # Grafana reads from this; trace_id field enables log ↔ trace correlation.
  loki:
    image: grafana/loki:3.1.1
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100" # Loki HTTP API
    volumes:
      - loki-data:/loki
    restart: unless-stopped

  # ── Grafana (dashboards + Explorer) ──────────────────────────────────────
  # Pre-provisioned with Prometheus, Loki, and Jaeger data sources.
  # Dashboard JSON auto-loaded from ./observability/grafana/dashboards/
  # UI: http://localhost:3000  admin/admin
  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/koncilia-sli-dashboard.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - jaeger
    restart: unless-stopped

volumes:
  backend-outputs:
  prometheus-data:
  loki-data:
  grafana-data:
  postgres-data:   # Persistencia local de PostgreSQL para data-service
