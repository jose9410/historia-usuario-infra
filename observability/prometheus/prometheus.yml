global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'local-dev'
    namespace: 'koncilia'

scrape_configs:
  # Scrapes metrics forwarded from both services via the OTel Collector
  # The Collector's Prometheus exporter aggregates all service metrics.
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # Direct scrape of historia-api (fallback / double-check)
  - job_name: 'historia-api'
    static_configs:
      - targets: ['backend:8080']
    metrics_path: '/metrics'

  # Direct scrape of qaautomation-api (fallback / double-check)
  - job_name: 'qaautomation-api'
    static_configs:
      - targets: ['automation-api:8080']
    metrics_path: '/metrics'
